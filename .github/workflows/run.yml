name: Run detect_redites
on: [push]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install sentence-transformers scikit-learn numpy
      - run: python detect_redites.py
